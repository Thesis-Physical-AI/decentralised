name: ci
on:
  pull_request:
  push:
    branches: [main]

# GitHub-hosted runners have no NVIDIA GPU: only GPU-free checks run here.
# Isaac Sim runs (hello_puppy.py --check, run_prototype.py) are run locally; see docs/PROTOTYPE.md.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest numpy ruff
      - name: Lint
        run: ruff check puppy_agent tests vlm_server sim run_prototype.py --select E,F,W --ignore E501,E402
      - name: Unit tests (executor, navigation, gait, contracts)
        run: python -m pytest -q tests/unit
